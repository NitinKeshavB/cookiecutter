# Repo-root hygiene checks for the cookiecutter template itself.
#
# The template tree is EXCLUDED on purpose: its files are Jinja templates, not
# valid source. `{{cookiecutter.package_import_name}}` is not a legal TOML bare
# key, so check-toml fails on the template pyproject.toml. The template's own
# pre-commit config runs inside generated projects instead, where the files are
# real; the functional test suite exercises that path.
#
# See https://pre-commit.com for more information.
exclude: |
  (?x)^(
    \{\{cookiecutter\.repo_name\}\}/.*|
    sample/.*|
    tests/cookiecutter.*\.json
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Fails if there are any ">>>>>" lines in files due to merge conflicts.
      - id: check-merge-conflict
      # Trims trailing whitespace. Allow a single space on the end of .md lines
      # for hard line breaks.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer
      # Attempts to load all TOML files to verify syntax.
      - id: check-toml
      # Attempts to load all yaml files to verify syntax; unsafe: only check
      # syntax, do not load yaml (the CI workflow uses Jinja raw blocks).
      - id: check-yaml
        args: ["--unsafe"]
      # Check for symlinks that do not point to anything.
      - id: check-symlinks
      # Fail if staged files are above a certain size.
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # Prevent addition of new git submodules.
      - id: forbid-new-submodules
      # Prevent committing directly to trunk.
      - id: no-commit-to-branch
        args: ["--branch=main"]
      # Detects the presence of private keys.
      - id: detect-private-key

  # Promote the Jinja contract (CLAUDE.md section 4) from a rule into a gate.
  # The PreToolUse hook stops Claude from writing a hazard; this stops a human
  # from committing one, and makes CI fail on it via `run.sh lint:ci`.
  - repo: local
    hooks:
      - id: jinja-safety
        name: jinja safety scan of the template tree
        entry: python3 .claude/hooks/check_jinja_safety.py --scan
        language: system
        pass_filenames: false
        always_run: true
